<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Courts and Rallies</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0b1020;
      color: #f5f5f5;
      margin: 0;
      padding: 0;
      display: flex;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: #151a2c;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 18px 40px rgba(0,0,0,0.4);
      max-width: 420px;
      width: 100%;
      box-sizing: border-box;
    }
    h1 {
      margin-top: 0;
      margin-bottom: 8px;
      font-size: 24px;
    }
    p {
      margin-top: 0;
      margin-bottom: 16px;
      font-size: 14px;
      color: #c2c7de;
    }
    button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 18px;
      border-radius: 999px;
      border: none;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      background: #3b82f6;
      color: #ffffff;
      transition: background 0.15s ease, transform 0.1s ease;
    }
    button:hover {
      background: #2563eb;
      transform: translateY(-1px);
    }
    button:active {
      transform: translateY(0);
    }
    #status {
      margin-top: 12px;
      font-size: 13px;
      color: #a5b4fc;
      min-height: 1em;
    }
    #error {
      margin-top: 4px;
      font-size: 12px;
      color: #fca5a5;
      min-height: 1em;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>Courts and Rallies</h1>
    <p>Click the button to talk to your backend and check if it is alive.</p>

    <button id="hostButton">Host a session</button>

    <div id="status"></div>
    <div id="error"></div>
  </div>
<script>
  console.log("JS is working!");

  const API_BASE = "https://courts-and-rallies.onrender.com";

  document.addEventListener("DOMContentLoaded", () => {
    const btn = document.getElementById("hostButton");
    const statusEl = document.getElementById("status");
    const errorEl = document.getElementById("error");

    console.log("Found host button:", btn);

    btn.addEventListener("click", async () => {
      console.log("Host button clicked, checking backend...");
      statusEl.textContent = "";
      errorEl.textContent = "";

      try {
        console.log("About to fetch:", API_BASE + "/health");

        const res = await fetch(API_BASE + "/health");
        console.log("Fetch finished, res:", res);

        if (!res.ok) {
          errorEl.textContent = "Backend returned an error: " + res.status;
          console.log("Backend error status:", res.status);
          return;
        }

        const data = await res.json();
        console.log("Backend JSON:", data);
        statusEl.textContent = "Backend status: " + (data.status || "unknown");
      } catch (e) {
        console.error("Network error talking to backend:", e);
        errorEl.textContent = "Could not reach backend. Check Render URL.";
      }
    });
  });
</script>
</body>
</html>
